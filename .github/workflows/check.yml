name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: checkout recipes (shared hotsplit module for tests)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: sikkatu/recipes
          path: recipes
      - name: shellcheck (every launcher script)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fail=0
          for f in $(find . -name "*.sh" -not -path "./.git/*"); do
            echo "== shellcheck $f"
            shellcheck --severity=error "$f" || fail=1
          done
          exit $fail
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: offline unit + config tests (no lmcache, no GPU)
        run: python -m pytest tests -q --ignore=tests/integration --ignore=tests/recovery
      - name: bash syntax of every launcher and unit
        run: |
          for f in scripts/*.sh systemd/kvp-lmcache-server; do
            bash -n "$f" || exit 1
          done
      - name: every Python module compiles
        run: python -m py_compile implementation/kvpersist/*.py tests/unit/*.py