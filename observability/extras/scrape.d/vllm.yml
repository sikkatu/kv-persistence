# extras/scrape.d/vllm.yml -- vLLM engine metrics through the local relay.
# The TARGET is generated by start-observability.sh into extras/targets/vllm.json
# (file_sd) so a changed engine port does not need a Prometheus restart.
# No static engine/model labels: vLLM exports both itself.
- job_name: vllm
  scrape_interval: 5s
  scrape_timeout: 4s
  metrics_path: /metrics
  file_sd_configs:
    - files: ["/etc/kvp-extras/targets/vllm.json"]
  metric_relabel_configs:
    # *_created series double the cardinality and no rule uses them
    - source_labels: [__name__]
      regex: "vllm:.*_created"
      action: drop
    # heavy histograms nobody queries -- dropped to keep /metrics cheap
    - source_labels: [__name__]
      regex: "vllm:request_params_.*|vllm:request_max_num_generation_tokens_.*|vllm:tool_call_parser_.*|vllm:mm_cache_.*"
      action: drop
