# observability/docker-compose.yml -- full LMCache monitoring stack for
# kv-persistence: OpenTelemetry Collector + Tempo + Prometheus + Grafana with
# the OFFICIAL LMCache dashboards pre-provisioned.
#
# One command brings the whole stack up:
#   cd observability && docker compose up -d
# Grafana  -> http://localhost:3000   (anonymous Admin access, no login form)
# Prometheus -> http://localhost:9091
# Tempo    -> http://localhost:3200
#
# Copied and adapted from the official LMCache example
# (LMCache/LMCache examples/observability, Apache-2.0) so that
# `docker compose up -d` in this folder is the SINGLE command required.
services:
  # OTel Collector -- receives OTLP from the lmcache server, fans out to
  # Tempo (traces) and Prometheus (metrics).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: obs_otel_collector
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "4320:4317"   # OTLP gRPC (LMCache --otlp-endpoint points here)
      - "8889:8889"   # Prometheus scrape endpoint
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
    restart: unless-stopped

  # Tempo -- trace storage + local-blocks TraceQL metrics.
  tempo:
    image: grafana/tempo:2.7.2
    container_name: obs_tempo
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    restart: unless-stopped

  # Prometheus -- metrics storage (7 days retention).
  prometheus:
    image: prom/prometheus:latest
    container_name: obs_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - otel-collector
    restart: unless-stopped

  # Grafana -- UI with the official LMCache dashboards auto-imported.
  grafana:
    image: grafana/grafana:latest
    container_name: obs_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  tempo_data:
  prometheus_data:
  grafana_data: